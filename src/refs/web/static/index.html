<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>refs</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <span class="brand">refs</span>
    <span class="prompt" id="prompt">/</span>
    <input id="q" autocomplete="off" spellcheck="false"
           placeholder="search   author:saez   course:220a   tag:theory   year:2019">
    <span class="menuwrap">
      <button class="act" id="colbutton" title="show or hide columns">columns</button>
      <div class="menu" id="colmenu" hidden></div>
    </span>
    <button class="act" id="addbutton" title="add a paper: paste a link or drop a PDF (key: a)">+ add</button>
    <span class="count" id="count"></span>
  </header>

  <main>
    <nav id="side" aria-label="Library"></nav>
    <div class="split" data-pane="side" title="drag to resize"></div>
    <section id="list" aria-label="Works"></section>
    <div class="split" data-pane="detail" title="drag to resize"></div>
    <aside id="detail" aria-label="Details"></aside>
  </main>

  <footer>
    <!-- The everyday keys, in the order of use: find a paper, act on it, cite
         it, add one. Everything else (g/G, p, f, F, m, R, t) is under "?". -->
    <span class="keys">
      <kbd>j</kbd><kbd>k</kbd> move <kbd>/</kbd> search <kbd>⏎</kbd> open
      <kbd>q</kbd> queue <kbd>r</kbd> read <kbd>n</kbd> note
      <kbd>y</kbd> citekey <kbd>b</kbd> bibtex <kbd>a</kbd> add <kbd>?</kbd> help
    </span>
    <span class="message" id="message"></span>
  </footer>

  <dialog id="help">
    <pre id="helptext"></pre>
  </dialog>
  <script src="/static/app.js"></script>
</body>
</html>
