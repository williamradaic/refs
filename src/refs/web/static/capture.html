<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>refs: add</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body { display: block; overflow: auto; }
    .page { max-width: 80ch; margin: 1.5em auto; padding: 0 16px; line-height: 1.6; }
    .page h1 { font-size: 15px; margin: 0 0 .3em; overflow-wrap: anywhere; }
    .dim { color: var(--dim); overflow-wrap: anywhere; }
    .state { margin: 1em 0; padding: 6px 1.5ch; border-left: 2px solid var(--accent); white-space: pre-wrap; }
    .state.ok { border-left-color: var(--ok); }
    .state.bad { border-left-color: var(--bad); }
    .row2 { display: flex; gap: 1.5ch; align-items: center; flex-wrap: wrap; margin-top: .6em; }
    label { color: var(--dim); cursor: pointer; }
    input[type=checkbox] { accent-color: var(--accent); }
    #into { font: inherit; color: inherit; background: none; border: 0; border-bottom: 1px solid currentColor;
            width: 18ch; padding: 0 2px; outline: 0; }
  </style>
</head>
<body>
  <div class="page">
    <h1 id="title">adding to refs</h1>
    <div class="dim" id="from"></div>
    <div class="state" id="state">grabbing PDF from the browser …</div>
    <div class="row2">
      <button class="act" id="go" hidden>add it (Enter)</button>
      <button class="act" id="lib" hidden>open it through the library</button>
      <label><input type="checkbox" id="queue"> also put it on the reading queue</label>
      <label>into <input id="into" list="colls" placeholder="#bets #220a" spellcheck="false" autocomplete="off"
             title="collections to put it in; remembered for the next paper (for a literature review)"></label>
      <datalist id="colls"></datalist>
      <button class="act" id="stay" hidden>keep this window open</button>
      <a class="act" href="/" target="refs-main">open refs</a>
    </div>
  </div>
  <script>
    // The window the "+ refs" bookmarklet opens (bookmarklet.html builds it).
    // Supports three delivery channels cleanly with `cid` deduplication:
    //   1. Direct raw upload from the bookmarklet (/api/capture-upload) — works under COOP
    //   2. postMessage ArrayBuffer -> raw upload (/api/capture-raw) — works under strict connect-src CSP
    //   3. Multipart <form> redirect (/capture-form -> /capture?cid=...) — works under both
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const pageUrl = params.get("add") ?? "";
    const cid = params.get("cid") ?? "";
    let started = false, closing = null, pending = false;
    let heard = false;
    let stage = "adding";
    let proxy = "";
    const ready = fetch("/api/bookmarklet").then((r) => r.json())
      .then((data) => { proxy = data.proxy ?? ""; }).catch(() => {});

    const viaProxy = (url) => proxy + (/qurl=$/i.test(proxy) ? encodeURIComponent(url) : url);
    const proxied = (url) => {
      try {
        const host = new URL(proxy).hostname, here = new URL(url).hostname;
        return here === host || here.endsWith("." + host);
      } catch { return false; }
    };

    function throughLibrary(url) {
      try { window.opener.location.href = viaProxy(url); }
      catch { window.open(viaProxy(url), "_blank"); }
    }

    $("from").textContent = pageUrl;
    try { $("queue").checked = localStorage.getItem("refs-capture-queue") === "1"; } catch {}
    try { $("into").value = localStorage.getItem("refs-capture-into") ?? ""; } catch {}
    const into = () => $("into").value.split(/[\s,]+/).map((w) => w.replace(/^#/, "")).filter(Boolean);

    // Sync remembered capture defaults to the server so direct uploads (Channel 1 / 3)
    // automatically use the same `into` collections and `queue` toggle.
    function syncPrefs() {
      fetch("/api/capture-prefs", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Refs": "1" },
        body: JSON.stringify({ queue: $("queue").checked, collections: into() }),
      }).catch(() => {});
    }
    syncPrefs();

    $("into").addEventListener("change", () => {
      try { localStorage.setItem("refs-capture-into", $("into").value); } catch {}
      syncPrefs();
    });
    $("queue").addEventListener("change", () => {
      try { localStorage.setItem("refs-capture-queue", $("queue").checked ? "1" : "0"); } catch {}
      syncPrefs();
    });
    fetch("/api/collections").then((r) => r.json()).then((data) => {
      $("colls").innerHTML = (data.collections ?? []).map((c) => `<option value="#${c.name}">`).join("");
    }).catch(() => {});

    function show(text, kind = "") {
      $("state").textContent = text;
      $("state").className = "state " + kind;
    }
    const mb = (bytes) => `${(bytes / 1048576).toFixed(1)} MB`;

    async function postJson(url, body) {
      const response = await fetch(url, { method: "POST",
        headers: { "Content-Type": "application/json", "X-Refs": "1" }, body: JSON.stringify(body) });
      return { ok: response.ok, status: response.status, data: await response.json().catch(() => ({})) };
    }

    async function follow(begun) {
      if (begun.data.message) { show("✓ " + begun.data.message, "ok"); closeSoon(3500); return; }
      if (!begun.data.job) { show(begun.data.detail ?? "could not start", "bad"); return; }
      for (;;) {
        await new Promise((resolve) => setTimeout(resolve, 900));
        let job;
        try { job = await (await fetch(`/api/job/${begun.data.job}`)).json(); }
        catch { show("lost contact with refs. If the PDF was saved, it is in the library folder.", "bad"); return; }
        if (job.state === "running") {
          show(`${stage} … ${job.seconds}s\n(PDF is safely saved; reading and renaming in the background — safe to close this window)`);
          continue;
        }
        const failed = job.state === "failed";
        const noPdf = /without a PDF/i.test(job.message ?? "");
        show((failed ? "" : "✓ ") + (job.message || job.state) + (noPdf
          ? "\n\nOpen the PDF in your browser and click + refs directly on the PDF to attach it."
          : ""), failed ? "bad" : "ok");
        if (noPdf && proxy && !proxied(pageUrl)) {
          $("lib").hidden = false;
          $("lib").onclick = () => throughLibrary(pageUrl);
        }
        if (noPdf) return;
        if (!failed) closeSoon(3500);
        return;
      }
    }

    function closeSoon(ms = 3500) {
      $("stay").hidden = false;
      closing = setTimeout(() => window.close(), ms);
    }
    $("stay").addEventListener("click", () => { clearTimeout(closing); $("stay").hidden = true; });

    // Called when Channel 1 (direct upload) or Channel 3 (form POST) already delivered the PDF to refs.
    async function fromUploaded(result, meta = {}) {
      if (started) return;
      started = heard = true;
      $("go").hidden = true;
      $("title").textContent = result.title || meta.title || "adding to refs";
      stage = result.bytes
        ? `✓ PDF saved (${mb(result.bytes)}); identifying & renaming`
        : "✓ PDF saved; identifying & renaming";
      show(stage + " …");
      await follow({ ok: true, status: 200, data: result });
    }

    async function fromBookmarklet(message) {
      if (started) return;
      started = heard = true;
      $("go").hidden = true;
      const meta = message.meta ?? {};
      $("title").textContent = meta.title || "adding to refs";
      const pdf = message.pdf instanceof ArrayBuffer && message.pdf.byteLength ? message.pdf : null;
      await ready;
      const url = message.url ?? pageUrl;

      if (!pdf && meta.pdf_problem === "paywall" && proxy && !proxied(url)) {
        show("Paywalled here. Opening the page through your library's proxy …\n\n" +
             "Sign in there if asked, then open the PDF or click + refs again.");
        throughLibrary(url);
        offerEnter("Paywalled here; the page is opening through your library's proxy. Sign in there " +
                   "if asked, then click + refs again.\n\nOr press Enter to save the paper without its PDF.", meta);
        $("go").textContent = "save without the PDF (Enter)";
        started = false;
        return;
      }

      if (pdf) {
        stage = `✓ PDF received (${mb(pdf.byteLength)}); identifying & renaming`;
        show(stage + " …");
        const q = new URLSearchParams({
          cid: message.cid || cid || "",
          url,
          doi: meta.doi || "",
          title: (meta.title || "").slice(0, 160),
          queue: $("queue").checked ? "true" : "false",
          to: into().join(","),
        });
        const response = await fetch(`/api/capture-raw?${q}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/pdf",
            "X-Refs": "1",
            "X-Refs-Token": message.token ?? "",
          },
          body: pdf,
        });
        const data = await response.json().catch(() => ({}));
        if (response.status === 403) {
          started = false;
          offerEnter(`${data.detail}\n\nPress Enter to add it anyway.`, meta);
          return;
        }
        await follow({ ok: response.ok, status: response.status, data });
        return;
      }

      stage = meta.pdf_url ? "the page's PDF needs another site or a sign-in; refs tries the link, then an open copy"
        : "no PDF on the page; refs looks for an open copy";
      show(stage + " …");
      const begun = await postJson("/api/capture", {
        token: message.token ?? "", url, meta, queue: $("queue").checked,
        collections: into(), pdf: null, cid: message.cid || cid || null,
      });
      if (begun.status === 403) {
        started = false;
        offerEnter(`${begun.data.detail}\n\nPress Enter to add it anyway.`, meta);
        return;
      }
      await follow(begun);
    }

    function offerEnter(text, meta = {}) {
      show(text);
      $("go").hidden = false;
      $("go").focus();
      $("go").onclick = async () => {
        if (started) return;
        started = true;
        $("go").hidden = true;
        show("adding …");
        await follow(await postJson("/api/add", { thing: pageUrl, queue: $("queue").checked, collections: into(),
          doi: meta.doi || params.get("doi") || null, pdf_url: meta.pdf_url || null }));
      };
    }
    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !$("go").hidden) $("go").click();
      if (event.key === "Escape") window.close();
    });

    window.addEventListener("message", (event) => {
      if (window.opener && event.source !== window.opener) return;
      if (event.data?.type === "refs-pending" && !started) {
        pending = true;
        show("fetching PDF in the browser tab …");
      }
      if (event.data?.type === "refs-uploaded") fromUploaded(event.data.result, event.data.meta);
      if (event.data?.type === "refs-capture") fromBookmarklet(event.data);
    });

    // Poll server rendezvous by `cid`: catches Channel 1 (direct upload under COOP)
    // and Channel 3 (multipart form redirect) automatically!
    async function pollRendezvous() {
      if (!cid) return;
      for (let tries = 0; tries < 80 && !started; tries++) {
        try {
          const s = await (await fetch(`/api/capture-status/${encodeURIComponent(cid)}`)).json();
          if (s.found) { await fromUploaded(s); return; }
        } catch {}
        await new Promise((r) => setTimeout(r, 400));
      }
    }

    if (!pageUrl && !cid) {
      show("Nothing to add. Use the + refs bookmarklet on a PDF or paper's page.", "bad");
    } else {
      if (cid) pollRendezvous();
      if (window.opener) {
        let tries = 0;
        const hello = setInterval(() => {
          if (started || heard) { clearInterval(hello); return; }
          try { window.opener.postMessage({ type: "refs-ready" }, "*"); } catch {}
          if (++tries > (pending ? 240 : 40)) {
            clearInterval(hello);
            if (!started) offerEnter("The page did not hand anything over. Press Enter to add its address.");
          }
        }, 400);
      } else if (!cid) {
        offerEnter("Press Enter to add it.");
      } else {
        // COOP cut window.opener: pollRendezvous() is already watching for Channel 1 / 3;
        // only show the Enter fallback if nothing arrives after 12 seconds.
        setTimeout(() => {
          if (!started && pageUrl) {
            offerEnter("Could not receive the PDF automatically from that tab. Press Enter to add its address.");
          }
        }, 12000);
      }
    }
  </script>
</body>
</html>
